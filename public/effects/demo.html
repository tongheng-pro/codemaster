<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Site Effects</title>
    <link rel="stylesheet" href="effects.css">
    <link rel="stylesheet" href="../sakura/sakura.css">
    <style>
        :root { --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --border: #d2d2d7; }
        :root.dark { --bg: #000000; --card: #1c1c1e; --text: #f5f5f7; --muted: #a1a1a6; --border: #3a3a3c; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        main { width: min(560px, 100% - 32px); padding: 32px; border-radius: 24px; background: var(--card); border: 1px solid var(--border); text-align: center; }
        h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.02em; }
        p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; }
        .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        select, button { font: inherit; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
        #hint { margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <main>
        <h1>Site Effects</h1>
        <p>Pick an effect, then move the mouse or click anywhere.</p>
        <div class="row">
            <select id="effect">
                <option value="none">None</option>
                <option value="sakura">🌸 Sakura petals (mouse)</option>
                <option value="snow">❄️ Snowfall (background)</option>
                <option value="leaves">🍂 Autumn leaves (background)</option>
                <option value="fireflies">✨ Fireflies (background)</option>
                <option value="sparkles">⭐ Sparkles (mouse)</option>
                <option value="bubbles">🫧 Bubbles (mouse)</option>
                <option value="magic-dust">🪄 Magic dust (mouse)</option>
                <option value="hearts">💗 Hearts (mouse)</option>
                <option value="code">&lt;/&gt; Code symbols (mouse)</option>
                <option value="confetti">🎉 Confetti (click)</option>
                <option value="ripple">💧 Ripple (click)</option>
            </select>
            <button type="button" id="theme">Toggle dark mode</button>
        </div>
        <p id="hint"></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="effects.js"></script>
    <script src="../sakura/sakura.js"></script>
    <script>
        var select = document.getElementById('effect');
        var hint = document.getElementById('hint');
        function apply(name) {
            SiteEffects.stop();
            SakuraBreeze.destroy();
            if (name === 'sakura') {
                SakuraBreeze.init();
            } else if (name !== 'none') {
                SiteEffects.start(name);
            }
            hint.textContent = name === 'none' ? '' : 'Tip: open ?effect=' + name + ' to link straight to this effect.';
        }
        select.addEventListener('change', function () { apply(select.value); });
        document.getElementById('theme').addEventListener('click', function () { document.documentElement.classList.toggle('dark'); });
        window.addEventListener('load', function () {
            var fromUrl = new URLSearchParams(location.search).get('effect');
            select.value = fromUrl && select.querySelector('option[value="' + fromUrl + '"]') ? fromUrl : 'sakura';
            apply(select.value);
        });
    </script>
</body>
</html>

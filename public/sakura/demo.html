<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sakura Breeze</title>

    <!-- 1. Effect styles -->
    <link rel="stylesheet" href="sakura.css">

    <style>
        :root {
            --bg: #fbf7f8;
            --text: #2b2227;
            --muted: #8a7a81;
            --accent: #e27a98;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #151214;
                --text: #f6eef1;
                --muted: #a8979e;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        main {
            max-width: 640px;
            padding: 24px 16px;
            text-align: center;
        }
        h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        h1 span { color: var(--accent); }
        p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; }
        button {
            padding: 12px 24px;
            border: 0;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <h1>Sakura <span>Breeze</span></h1>
        <p>Move your mouse slowly for a few drifting petals, or sweep it quickly to release a spring breeze.
           Buttons and links keep working underneath the petals.</p>
        <button type="button" onclick="alert('Clicks pass straight through the petals.')">Try clicking me</button>
    </main>

    <!-- 2. Optional: override any setting before the script loads -->
    <script>
        window.SAKURA_CONFIG = {
            // maxParticles: 48,
            // spawnRate: 0.03,
            // petalSize: [9, 16],
            // duration: [2.4, 4.2],
            // windStrength: 1,
            // mouseSensitivity: 1,
        };
    </script>

    <!-- 3. GSAP from the CDN, then the effect -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="sakura.js"></script>
</body>
</html>
